model_list:
  - model_name: "gpt-*"
    litellm_params:
      model: "chatgpt/gpt-*"
    model_info:
      mode: responses
  - model_name: "codex-*"
    litellm_params:
      model: "chatgpt/codex-*"
    model_info:
      mode: responses
  # Claude Code sees only this shared alias. Provider credentials stay behind
  # LiteLLM and are shuffled with retry/failover across the entire pool.
  - &openrouter_claude
    model_name: "claude-code"
    litellm_params: &openrouter_params
      model: "openrouter/deepseek/deepseek-v4.1-flash"
      api_key: os.environ/OPEN_R
      drop_params: true
      additional_drop_params:
        - prompt_cache_key
    model_info: &chat_mode
      mode: chat
  - <<: *openrouter_claude
    litellm_params: { <<: *openrouter_params, api_key: os.environ/OPEN_ROUTER }
  - <<: *openrouter_claude
    litellm_params: { <<: *openrouter_params, api_key: os.environ/OPEN_ROUTER1 }
  - <<: *openrouter_claude
    litellm_params: { <<: *openrouter_params, api_key: os.environ/OPEN_ROUTER2 }
  - <<: *openrouter_claude
    litellm_params: { <<: *openrouter_params, api_key: os.environ/OPEN_ROUTER4 }
  - <<: *openrouter_claude
    litellm_params: { <<: *openrouter_params, api_key: os.environ/OPEN_ROUTER_ }
  - <<: *openrouter_claude
    litellm_params: { <<: *openrouter_params, api_key: os.environ/OPEN_ROUTER_3 }
  - <<: *openrouter_claude
    litellm_params: { <<: *openrouter_params, api_key: os.environ/OPEN_ROUTER_ETI }
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
litellm_settings:
  set_verbose: false
router_settings:
  routing_strategy: simple-shuffle
  enable_weighted_failover: true
  num_retries: 5
