# Save as ~/.codex/litellm_subscription.config.toml after proxy validation.
# Select with codex --profile litellm_subscription (no default switch).
model_provider = "litellm_subscription"

[model_providers.litellm_subscription]
name = "LiteLLM subscription"
base_url = "http://localhost:4000/v1"
wire_api = "responses"
supports_websockets = false
requires_openai_auth = true
env_http_headers = { "x-litellm-api-key" = "GGM_LITELLM_API_KEY" }
