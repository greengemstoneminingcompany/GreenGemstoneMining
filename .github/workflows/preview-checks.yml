name: Preview quality checks

on:
  push:
    branches:
      - preview/resource-navigation-gallery
      - feature/advanced-design-creative-studio
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck, lint, editor syntax checks, tests, and production build
        run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright regression tests
        run: npx playwright test
