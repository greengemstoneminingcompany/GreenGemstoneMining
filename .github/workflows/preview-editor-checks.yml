name: Preview branch quality checks

on:
  push:
    branches:
      - preview/resource-navigation-gallery
  pull_request:
    branches:
      - preview/resource-navigation-gallery

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
