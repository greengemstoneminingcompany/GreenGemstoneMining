name: Visual Editor Preview Checks

on:
  push:
    branches:
      - preview/resource-navigation-gallery
  pull_request:
    branches:
      - preview/resource-navigation-gallery

permissions:
  contents: read

jobs:
  preview-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Bootstrap disposable PostgreSQL auth stubs
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d migration_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          INSERT INTO auth.users(id) VALUES ('00000000-0000-4000-8000-000000000001');
          INSERT INTO auth.users(id) VALUES ('00000000-0000-4000-8000-000000000002');
          SQL
      - name: Apply visual editor migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d migration_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261028090000_add_visual_editor_drafts.sql
      - name: Apply Creative Studio template and privilege migrations to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d migration_test -v ON_ERROR_STOP=1 <<'SQL'
          -- The privilege migration also covers application tables created by the
          -- production base schema; minimal stubs keep this focused DB disposable.
          CREATE TABLE IF NOT EXISTS public.admin_users (id uuid);
          CREATE TABLE IF NOT EXISTS public.leads (id uuid);
          CREATE TABLE IF NOT EXISTS public.media_uploads (id uuid);
          CREATE TABLE IF NOT EXISTS public.ai_usage_daily (id uuid);
          SQL
          for migration in \
            supabase/migrations/20261029021000_preview_creative_studio_server_templates.sql \
            supabase/migrations/20261029022000_tighten_preview_template_block_validation.sql \
            supabase/migrations/20261029023000_preview_template_actor_indexes.sql \
            supabase/migrations/20261029024000_tighten_preview_table_privileges.sql; do
            psql -h localhost -U postgres -d migration_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Smoke-test visual editor authorization, save, publish, restore, and immutability
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d migration_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.visual_editor_admins(user_id) VALUES ('00000000-0000-4000-8000-000000000001');
          BEGIN;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '00000000-0000-4000-8000-000000000001', false);
          DO $$
          DECLARE
            draft public.visual_editor_drafts;
            published public.visual_editor_drafts;
            restored public.visual_editor_drafts;
          BEGIN
            draft := public.save_visual_editor_draft(NULL, 0, 'CI draft', '{"text":{}}'::jsonb);
            IF draft.version <> 1 OR draft.status <> 'draft' THEN
              RAISE EXCEPTION 'initial save returned unexpected draft state';
            END IF;
            BEGIN
              PERFORM public.save_visual_editor_draft(draft.id, 0, 'Stale save', '{"text":{}}'::jsonb);
              RAISE EXCEPTION 'stale version was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '40001' THEN
              NULL;
            END;
            published := public.publish_visual_editor_draft(draft.id, draft.version);
            IF published.status <> 'published' THEN
              RAISE EXCEPTION 'publish did not return a published snapshot';
            END IF;
            restored := public.restore_visual_editor_version(draft.id, 1);
            IF restored.id = draft.id OR restored.status <> 'draft' THEN
              RAISE EXCEPTION 'restore did not create a new draft';
            END IF;
            IF public.get_published_visual_editor_payload() IS NULL THEN
              RAISE EXCEPTION 'published payload reader returned NULL';
            END IF;
          END $$;
          SELECT set_config('request.jwt.claim.sub', '00000000-0000-4000-8000-000000000002', false);
          DO $$
          BEGIN
            BEGIN
              PERFORM public.save_visual_editor_draft(NULL, 0, 'Unauthorized', '{"text":{}}'::jsonb);
              RAISE EXCEPTION 'non-admin save was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '42501' THEN
              NULL;
            END;
          END $$;
          COMMIT;
          RESET ROLE;
          DO $$
          BEGIN
            BEGIN
              UPDATE public.visual_editor_versions SET note = 'tampered'
              WHERE draft_id = (SELECT id FROM public.visual_editor_drafts WHERE name = 'CI draft')
                AND version = 1;
              RAISE EXCEPTION 'immutable history update was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
          END $$;
          SQL
      - name: Smoke-test shared Creative Studio template CRUD and authorization
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d migration_test -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', '00000000-0000-4000-8000-000000000001', true);
          DO $$
          DECLARE
            saved public.visual_editor_templates;
            updated public.visual_editor_templates;
          BEGIN
            saved := public.save_visual_editor_template(NULL, 'CI shared template', '{"kind":"section","title":"Preview"}'::jsonb);
            IF saved.name <> 'CI shared template' OR saved.project_key <> 'ggmc-preview' THEN
              RAISE EXCEPTION 'template create returned unexpected data';
            END IF;
            IF (SELECT count(*) FROM public.list_visual_editor_templates()) <> 1 THEN
              RAISE EXCEPTION 'admin template list did not return the created template';
            END IF;
            updated := public.save_visual_editor_template(saved.id, 'CI updated template', '{"kind":"card"}'::jsonb);
            IF updated.name <> 'CI updated template' OR updated.block->>'kind' <> 'card' THEN
              RAISE EXCEPTION 'template update returned unexpected data';
            END IF;
            IF NOT public.delete_visual_editor_template(saved.id) THEN
              RAISE EXCEPTION 'template delete did not report success';
            END IF;
            IF public.delete_visual_editor_template(saved.id) THEN
              RAISE EXCEPTION 'deleting an absent template unexpectedly succeeded';
            END IF;
            BEGIN
              PERFORM public.save_visual_editor_template(NULL, 'Invalid kind', '{"kind":"unknown"}'::jsonb);
              RAISE EXCEPTION 'unsupported template kind was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN
              NULL;
            END;
            BEGIN
              PERFORM public.save_visual_editor_template(NULL, 'Missing kind', '{"title":"No kind"}'::jsonb);
              RAISE EXCEPTION 'template without kind was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '22023' THEN
              NULL;
            END;
          END $$;
          COMMIT;
          RESET ROLE;
          SET ROLE anon;
          DO $$
          BEGIN
            BEGIN
              PERFORM public.list_visual_editor_templates();
              RAISE EXCEPTION 'anonymous template listing was unexpectedly accepted';
            EXCEPTION WHEN SQLSTATE '42501' THEN
              NULL;
            END;
          END $$;
          RESET ROLE;
          SQL
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Synchronize canonical editor modules before browser tests
        run: node scripts/sync-visual-editor-features.mjs
      - name: Browser-level visual editor regression tests
        run: npx playwright test
      - name: Production build
        run: npm run build
