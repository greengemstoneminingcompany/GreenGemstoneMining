<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="ggmc-preview-editor" content="enabled"><title>Visual editor browser test fixture</title></head>
<body>
 <div id="root" data-ve-viewport="before" style="max-width: 900px; width: 90%; margin-inline: 0 auto; box-shadow: 1px 2px 3px red">
  <main>
   <h1 id="headline" style="color: #ffffff">White text that should be editable</h1>
   <h2 id="split-headline" style="color: #ffffff">Somaliland's <span>mineral frontier</span></h2>
   <img id="test-image" alt="Original image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/xwAAAABJRU5ErkJggg==">
   <section class="nested">Section label <a href="#contact">Nested contact link</a><button type="button">Nested action</button></section>
   <section class="nested-punctuation">Section label <a href="#contact">Nested contact link</a><button type="button">Nested action</button>.</section>
   <p id="contact">Contact</p>
  </main>
 </div>
 <script>
  window.__GGMC_EDITOR_API__={getSession:async()=>({email:'test@example.com',isAdmin:true}),signIn:async()=>{},signOut:async()=>{}};
  const manyLayers=document.createElement('section');manyLayers.id='many-layers';
  for(let i=0;i<105;i++){const button=document.createElement('button');button.textContent='Extra layer '+i;manyLayers.append(button);}
  document.querySelector('#root main').append(manyLayers);
 </script>
 <script type="module" src="/src/previewEditorBootstrap.ts"></script>
</body>
</html>
